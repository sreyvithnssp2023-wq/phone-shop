services:
  - type: web
    name: angkorelectronic
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: PHP_CLI_SERVER_WORKERS
        value: "4"
      - key: APP_NAME
        value: Phone Shop
      - key: APP_ENV
        value: production
      - key: APP_KEY
        value: base64:7Kx8XG3V1/2yJ9mK8uN7Q0vP5wR4tS3u1vX0yZ2aB4c=
      - key: APP_DEBUG
        value: "false"
      - key: SESSION_DRIVER
        value: "file"
      - key: CACHE_STORE
        value: "file"
      - key: QUEUE_CONNECTION
        value: "sync"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_PORT
        value: "3306"
      - key: DB_HOST
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

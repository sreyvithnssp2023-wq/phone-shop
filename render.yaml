services:
  - type: web
    name: angkorelectronic
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: PORT
        value: "10000"
      - key: PHP_CLI_SERVER_WORKERS
        value: "4"
      - key: APP_NAME
        value: Phone Shop
      - key: APP_ENV
        value: production
      - key: APP_KEY
        value: base64:7Kx8XG3V1/2yJ9mK8uN7Q0vP5wR4tS3u1vX0yZ2aB4c=
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://phone-shop-2-nc9l.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      # === DATABASE ===
      # Default: SQLite (data resets on Render Free redeploy — acceptable for student project)
      # To use MySQL: change DB_CONNECTION to mysql and fill in the MySQL vars below
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /app/database/database.sqlite
      # === MySQL (optional — set these in the Render dashboard if you have a remote MySQL) ===
      # - key: DB_CONNECTION
      #   value: mysql
      # - key: DB_HOST
      #   sync: false
      # - key: DB_PORT
      #   value: "3306"
      # - key: DB_DATABASE
      #   sync: false
      # - key: DB_USERNAME
      #   sync: false
      # - key: DB_PASSWORD
      #   sync: false
      # === CORS ===
      - key: CORS_ALLOWED_ORIGINS
        value: "https://angkor-electronic-1qgb.vercel.app,http://localhost:3000"
